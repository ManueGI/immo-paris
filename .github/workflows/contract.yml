# API contract guard: fails a pull request that breaks api/openapi.json compared to its base
# branch (removed endpoint or field, changed type...), since installed mobile apps cannot be
# updated instantly. An intentional break must be made explicit with the `breaking-change`
# label on the pull request.
name: API contract

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  breaking-changes:
    name: API contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, to read openapi.json from the base branch
          fetch-depth: 0

      - name: Get the contract of the base branch
        id: base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git show "origin/$BASE_REF:api/openapi.json" > "$RUNNER_TEMP/base.json" 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No api/openapi.json on $BASE_REF yet: nothing to compare"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect breaking changes
        if: >-
          steps.base.outputs.exists == 'true'
          && !contains(github.event.pull_request.labels.*.name, 'breaking-change')
        # Image pinned by digest (v1.32.1); errors are annotated on the pull request
        run: >-
          docker run --rm
          -v "$RUNNER_TEMP:/base:ro" -v "$PWD:/head:ro"
          tufin/oasdiff@sha256:3b14fe0112e5d1bf862f91ab234a4bcd161a3f399e98f8b0b665ce70857694ac
          breaking /base/base.json /head/api/openapi.json
          --fail-on ERR --format githubactions

      - name: Intentional breaking change
        if: contains(github.event.pull_request.labels.*.name, 'breaking-change')
        run: |
          echo "::warning::Labelled breaking-change: the contract check is skipped on purpose"
