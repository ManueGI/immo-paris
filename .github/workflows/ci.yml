# Continuous integration of the API (api/): runs its definition of done (see api/CLAUDE.md)
# on a fresh machine for every push to main and every pull request.
#
# No `paths` filter on purpose: these jobs are required checks, and a workflow skipped by a
# path filter never reports them, which would block pull requests that do not touch api/.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run still in progress for the previous one
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to a commit SHA (immutable), with the version as a comment: a moved or
# hijacked tag cannot change the code that runs here. Dependabot keeps the pins up to date.

# Least privilege: the workflow only needs to read the code
permissions:
  contents: read

jobs:
  checks:
    name: Lint, migrations, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # PostgreSQL + PostGIS container started next to the job, like compose.yaml locally
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: immo
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: immo_paris
        ports:
          - 5432:5432
        # Wait until the database accepts TCP connections before running the steps
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U immo -d immo_paris"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      # Throwaway database that only exists during this job: this password is not a secret
      DATABASE_URL: postgresql://immo:ci-only-password@localhost:5432/immo_paris

    defaults:
      run:
        working-directory: api

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.20"
          # Reuse downloaded packages between runs
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Install dependencies
        # --locked fails if uv.lock is out of date with pyproject.toml
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        # GitHub output format: errors are shown on the lines of the diff
        run: uv run ruff check --output-format=github .

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Check models and migrations are in sync
        run: uv run alembic check

      - name: Run tests
        run: uv run pytest

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./api
          # Only prove that the image builds; publishing comes with the deployment
          push: false
          tags: immo-paris-api:ci
          # Keep Docker layers in the GitHub Actions cache between runs
          cache-from: type=gha
          cache-to: type=gha,mode=max
