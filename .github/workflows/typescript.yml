# Continuous integration of the TypeScript workspace (packages/, and later web/ and mobile/).
# No `paths` filter on purpose: this job is a required check (see the root CLAUDE.md).
name: TypeScript

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: typescript-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  packages:
    name: TypeScript packages
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        # Version read from the packageManager field of package.json
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        # --frozen-lockfile fails if pnpm-lock.yaml is out of date with package.json
        run: pnpm install --frozen-lockfile

      - name: Check the API client is generated from the current contract
        run: |
          pnpm generate
          git diff --exit-code -- packages/ || {
            echo "::error::Generated code is out of date with api/openapi.json: run pnpm generate and commit"
            exit 1
          }

      - name: Type-check
        run: pnpm typecheck

      - name: Build
        run: pnpm build
