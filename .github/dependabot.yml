# Weekly grouped pull requests to update dependencies. Each one goes through CI like any
# other pull request.
version: 2
updates:
  # Actions of .github/workflows, pinned to commit SHAs
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # Python dependencies of the API (api/uv.lock)
  - package-ecosystem: uv
    directory: /api
    schedule:
      interval: weekly
    groups:
      api-python:
        patterns: ["*"]

  # Base images of the API Docker image
  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: weekly
    ignore:
      # The image must match requires-python in api/pyproject.toml (3.12): moving to a newer
      # Python is a deliberate change of both, not an automatic bump
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # TypeScript workspace (pnpm-lock.yaml)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      typescript:
        patterns: ["*"]
    ignore:
      # Angular supports one TypeScript minor version (6.0.x for Angular 22)
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Angular major versions are upgraded with `ng update`, which also migrates the code
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-devkit/*"
        update-types: ["version-update:semver-major"]
