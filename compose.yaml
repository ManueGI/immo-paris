# Local services, run from the repository root. Values come from the root .env file
# (see .env.example).
#
#   docker compose up -d --wait                 database only (API run with uv from api/)
#   docker compose --profile app up -d --wait   + migrations + containerized API on :8080
services:
  db:
    # Same major version as the target Amazon RDS instance
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      # Bound to localhost only: the database is not reachable from the local network
      - "127.0.0.1:5432:5432"
    volumes:
      # Named volume: data survives container restarts and removals
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Check over TCP: during first-start initialisation, the temporary server only
      # listens on the Unix socket, so the container is not reported healthy too early
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Applies pending migrations once, then exits. Kept out of the API startup: with several
  # API containers, each would try to migrate at the same time.
  migrate:
    profiles: [app]
    image: immo-paris-api:dev
    build: ./api
    command: ["alembic", "upgrade", "head"]
    environment: &app-environment
      # Inside the Compose network, the database host is the service name "db"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200,http://localhost:8081}
    depends_on:
      db:
        condition: service_healthy

  api:
    profiles: [app]
    image: immo-paris-api:dev
    build: ./api
    environment: *app-environment
    ports:
      # 8080 on the host by default, so it does not clash with the API run with uv on 8000
      - "127.0.0.1:${API_DOCKER_PORT:-8080}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # The slim image has no curl: use Python to call /health
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  pgdata:
